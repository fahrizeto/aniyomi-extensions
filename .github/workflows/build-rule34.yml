name: Build Rule34Video
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew :src:en:rule34video:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rule34video-apk
          path: '**/build/**/*.apk'
